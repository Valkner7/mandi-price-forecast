<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandi Price Forecast & Location Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard/style.css">
    
    <!-- Leaflet CSS for Map Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header class="navbar">
        <h1>🌾 Mandi Price Forecast & GPS Dashboard</h1>
    </header>

    <main class="container">
        <!-- GPS Location & Map Section -->
        <section class="card gps-section">
            <h2>📍 Nearby Punjab Mandis</h2>
            <p>Locate your nearest mandis and check straight-line distance using live GPS.</p>
            
            <div class="gps-controls">
                <button id="detect-location-btn" class="btn-primary">📡 Find My Nearby Mandis</button>
                <span id="location-status">Click to detect your location</span>
            </div>

            <div id="map" class="map-container" style="height: 400px; width: 100%;"></div>

            <div class="nearby-results">
                <h3>Nearest Mandis List</h3>
                <ul id="nearby-mandis-list">
                    <li>No location detected yet. Click "Find My Nearby Mandis".</li>
                </ul>
            </div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/dashboard/app.js"></script>
</body>
</html>
