name: Update mandi prices daily

# Agmarknet mandi prices are reported once per trading day, typically
# posted by early evening IST. Running this more than once a day won't
# find new data — it'll just re-fetch the same day's numbers. 18:00 UTC
# = 11:30 PM IST, comfortably after the day's prices are usually posted;
# adjust if you find the source updates earlier or later.
#
# You can also trigger this manually any time from the Actions tab
# (workflow_dispatch below) — useful right before a demo to force a
# fresh pull instead of waiting for the schedule.
on:
  schedule:
    # Runs twice: once in the evening after prices typically post, and
    # once again a few hours later as a safety net. The shared public
    # data.gov.in demo key can be unreliable/congested at times (shared
    # across every anonymous user of that key) — a second attempt later
    # the same night meaningfully increases the odds one of the two gets
    # through, without needing a dedicated API key. If a dedicated key is
    # added later (see fetch_daily_mandi_data.py docstring), one run a day
    # is plenty and the second can be removed.
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Two scheduled runs a night plus manual runs must not overlap: a second run
# starting while the first is mid-push would race on the same files.
concurrency:
  group: update-mandi-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    # The fetch alone can take ~9 minutes when api.data.gov.in is unreachable
    # (5 attempts x 90 s timeout plus backoff); this only stops a truly hung
    # job from running for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        # numpy is listed explicitly even though pandas currently pulls it
        # in transitively — train_forecast_model.py and price_model.py both
        # import it directly, so it shouldn't depend on pandas' dependency
        # graph staying the same.
        run: pip install -c constraints.txt pandas numpy requests lightgbm joblib scikit-learn

      - name: Check data.gov.in reachability (diagnostic only)
        # Never fails the job. It exists so a failed fetch explains itself in
        # the log: on 30 Sep 2026 the fetch died with "connection refused" /
        # "connect timeout" from BOTH GitHub's runner and a home PC in India,
        # and nothing in the log said whether DNS, TCP or the site itself was
        # at fault. Prints the runner's public IP, the DNS answer, and the
        # HTTP/connect result for the API host and the main portal.
        continue-on-error: true
        run: |
          echo "Runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          getent hosts api.data.gov.in || echo "DNS lookup for api.data.gov.in failed"
          for host in api.data.gov.in data.gov.in; do
            curl -sS -o /dev/null -I --max-time 20 \
              -w "$host -> HTTP %{http_code}, connect %{time_connect}s, total %{time_total}s\n" \
              "https://$host/" || echo "$host is unreachable from this runner"
          done

      - name: Fetch latest Punjab mandi prices
        env:
          # Set this in your repo's Settings -> Secrets and variables ->
          # Actions -> New repository secret. Falls back to the shared
          # public demo key if unset, which works but is rate-limited —
          # see fetch_daily_mandi_data.py's docstring for how to get your
          # own free key.
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python fetch_daily_mandi_data.py

      - name: Commit and push the fetched data
        # Committed BEFORE retraining on purpose. The source only serves a
        # current-day snapshot, so a day that is fetched but not committed
        # is lost for good. If the retrain below fails, this day's rows are
        # already safe in the repo.
        run: |
          git config user.name "mandi-price-bot"
          git config user.email "actions@github.com"
          # The timestamped backup files are useful locally for one run but
          # would otherwise pile up in the repo forever.
          rm -f clean_mandi_prices_backup_*.csv
          git add clean_mandi_prices.csv
          # quarantined_rows.csv accumulates any rows fetch_daily_mandi_data.py
          # rejects as implausible (see data_quality.py). Guarded with -f since
          # it won't exist until the first row is ever flagged, and `git add`
          # on a missing path would fail this step (bash -e).
          if [ -f quarantined_rows.csv ]; then
            git add quarantined_rows.csv
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update mandi prices ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Retrain the forecasting model on the updated data
        # train_forecast_model.py exits non-zero on a training or self-check
        # failure (see its docstring / price_model.py), which fails this step
        # and stops the workflow before the model commit below runs, so a bad
        # artifact never gets committed or deployed. The data commit above
        # has already happened by then, which is intended.
        run: python train_forecast_model.py

      - name: Commit and push the retrained model
        run: |
          git config user.name "mandi-price-bot"
          git config user.email "actions@github.com"
          git add models/lgbm_price_model.joblib models/lgbm_price_model_meta.json
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Retrain forecast model ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Trigger Render redeploy
        if: success()
        env:
          # Optional. Render dashboard -> your service -> Settings ->
          # Deploy Hook -> copy the URL, add it as a repo secret named
          # RENDER_DEPLOY_HOOK_URL. Without this secret set, this step is
          # skipped (Render will still pick up the change on its own next
          # deploy, just not automatically triggered).
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping auto-redeploy. Render will use this data on its next deploy anyway."
          fi
